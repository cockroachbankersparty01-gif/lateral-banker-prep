name: Build APK

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/daily-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LateralBankerPrep.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LateralBankerPrep-apk
          path: LateralBankerPrep.apk
      - name: Publish as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lateral Banker Prep – build ${{ github.run_number }}
          make_latest: true
          body: |
            Download **LateralBankerPrep.apk** below and open it on your Android phone (Android 7.0+).
            Allow "Install unknown apps" when asked. Jobs and results update inside the app automatically.
          files: LateralBankerPrep.apk
      - name: Save the APK to the "apk" branch (direct copy for sharing)
        run: |
          mkdir /tmp/apkbranch && cp LateralBankerPrep.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add LateralBankerPrep.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
