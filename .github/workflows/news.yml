name: Daily banking news

on:
  schedule:
    - cron: "40 0 * * *"   # 06:10 IST
    - cron: "40 8 * * *"   # 14:10 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banking-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RBI, PIB and Google News feeds
        run: python scripts/news.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update banking news $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
