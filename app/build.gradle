plugins {
    id 'com.android.application'
}

android {
    namespace 'in.lateralbanker.prep'
    compileSdk 34

    defaultConfig {
        applicationId "in.lateralbanker.prep"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
